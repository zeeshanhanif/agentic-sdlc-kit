schema_version: "1.1"
name: detailed-design-skips-tombstoned
description: 'A tombstoned FEAT (Removed) is skipped, never designed: next-selection lands on FEAT-003.'
tags: [behaviour]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 12
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'Design the next feature.'
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?detailed-design"'
    min: 1
  - name: resolves-feat-003
    type: regex
    target: trace
    pattern: '(FEAT-003[^\n]{0,120}\bnext\b|\bnext\b[^\n]{0,120}FEAT-003)'
    flags: i
  - name: never-feat-002
    type: regex
    target: trace
    pattern: 'FEAT-002[^\n]{0,40}\bis (the )?next\b'
    match: not_contains
