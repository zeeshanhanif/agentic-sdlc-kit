schema_version: "1.1"
name: ui-design-next-per-sequence
description: 'ui-design (per-feature mode) takes the first feature with technical-design.md but no ui-design.md, and announces it.'
tags: [behaviour]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 12
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'Design the screens for the next feature.'
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?ui-design"'
    min: 1
  - name: resolves-feat-002
    type: regex
    target: trace
    pattern: '(FEAT-002[^\n]{0,120}\bnext\b|\bnext\b[^\n]{0,120}FEAT-002)'
    flags: i
