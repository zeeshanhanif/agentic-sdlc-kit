schema_version: "1.1"
name: feature-implementation-stops-without-design
description: 'feature-implementation refuses to improvise: with no FEAT-003 folder it stops and names the missing design pair.'
tags: [behaviour]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 15
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'Run feature-implementation on FEAT-003.'
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?feature-implementation"'
    min: 1
  - name: names-missing-design
    type: regex
    target: last_message
    pattern: 'technical-design|tasks\.md'
  - name: points-at-design-step
    type: regex
    target: last_message
    pattern: 'detailed-design|design pair|design step'
    flags: i
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: stops-cleanly
    type: llm
    focus: last_message
    criteria: |
      PASS if the response stops without implementing anything, states plainly that FEAT-003 has no feature folder / technical-design.md / tasks.md, and says the design step (detailed-design, then ui-design) has to run first.
      FAIL if it drafts a design or task list itself, starts writing code, or proposes implementing FEAT-003 from the plan entry alone.
