schema_version: "1.1"
name: detailed-design-next-per-sequence
description: 'detailed-design computes the next undesigned feature from the plan sequence minus existing feature folders, and announces it.'
tags: [behaviour]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 12
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'Design the next feature.'
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?detailed-design"'
    min: 1
  - name: resolves-feat-002
    type: regex
    target: trace
    pattern: '(FEAT-002[^\n]{0,120}\bnext\b|\bnext\b[^\n]{0,120}FEAT-002)'
    flags: i
  - name: not-feat-003-or-004
    type: regex
    target: trace
    pattern: 'FEAT-00[34][^\n]{0,40}\bis (the )?next\b'
    match: not_contains
