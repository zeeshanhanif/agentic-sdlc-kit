schema_version: "1.1"
name: feature-implementation-stops-without-codebase
description: 'The test harness and stack are inherited from the live codebase, never chosen here: a docs-only repo means stop and route to project-scaffolding.'
tags: [behaviour]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 15
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill]
  prompt: 'Implement the next feature.'
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?feature-implementation"'
    min: 1
  - name: routes-to-scaffolding
    type: regex
    target: last_message
    pattern: 'scaffold'
    flags: i
  - name: no-app-code-written
    type: regex
    target: files
    pattern: 'package\.json|\.(ts|tsx|js|jsx|py)\b'
    match: not_contains
  - name: no-task-checked
    type: regex
    target: { source: file, path: docs/features/FEAT-002-complete-task/tasks.md }
    pattern: '- \[x\]'
    match: not_contains
  - name: stops-and-routes
    type: llm
    focus: last_message
    criteria: |
      PASS if the response stops before implementing, states that the repository has no codebase or test harness to build on (only docs/), and routes to project-scaffolding (or asks the user to run it) before feature-implementation continues.
      FAIL if it creates application code, picks a stack or test framework itself, marks any FEAT-002 task complete, or claims tasks were done.
