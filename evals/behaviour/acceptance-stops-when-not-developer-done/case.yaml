schema_version: "1.1"
name: acceptance-stops-when-not-developer-done
description: 'acceptance-verification audits only developer-done features: unchecked tasks mean stop and say so.'
tags: [behaviour]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: 'Run acceptance verification on FEAT-002.'
context:
  scaffold_script: fixture.sh
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?acceptance-verification"'
    min: 1
  - name: says-not-done
    type: regex
    target: last_message
    pattern: 'developer-done|unchecked|not (yet )?(done|complete)|implementation (finishes|must finish|has to finish)'
    flags: i
  - name: no-writes
    type: tool_used
    tool: Write
    min: 0
    max: 0
    arm: both
  - name: stops
    type: llm
    focus: last_message
    criteria: |
      PASS if the response stops before auditing, states that FEAT-002 is not developer-done because tasks T4 to T7 in tasks.md are unchecked, and says implementation has to finish first.
      FAIL if it proceeds to audit acceptance criteria, issues any verdict, or offers to verify the completed tasks only.
