schema_version: "1.1"
name: trigger-detailed-design
description: 'The detailed-design description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'Create the technical design for the next feature in the plan.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?detailed-design"'
    min: 1
