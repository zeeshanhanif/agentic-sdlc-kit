schema_version: "1.1"
name: trigger-initial-deployment
description: 'The initial-deployment description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'Do the first deploy of the skeleton to staging and set up the environments and CD.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?initial-deployment"'
    min: 1
