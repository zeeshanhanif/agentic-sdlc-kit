schema_version: "1.1"
name: trigger-implementation-planning
description: 'The implementation-planning description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'The SRS and the architecture are finalized. Break the system into epics and vertical feature slices and tell me what we build first, and in what order.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?implementation-planning"'
    min: 1
