schema_version: "1.1"
name: trigger-software-architecture
description: 'The software-architecture description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'Help me architect a new inventory service for a mid-size warehouse. The requirements are in docs/srs.md.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?software-architecture"'
    min: 1
