schema_version: "1.1"
name: trigger-pipeline-verify
description: 'The pipeline-verify description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'Check whether the pipeline documents are consistent: dangling IDs, orphan requirements, broken seams.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?pipeline-verify"'
    min: 1
