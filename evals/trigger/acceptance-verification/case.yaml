schema_version: "1.1"
name: trigger-acceptance-verification
description: 'The acceptance-verification description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'Independently audit FEAT-001 against its acceptance criteria. Is the feature really done?'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?acceptance-verification"'
    min: 1
