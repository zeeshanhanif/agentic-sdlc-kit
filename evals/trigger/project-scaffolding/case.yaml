schema_version: "1.1"
name: trigger-project-scaffolding
description: 'The project-scaffolding description fires on a paraphrase of its trigger intent (review finding 2).'
tags: [trigger]
runs: 2
execution:
  model: claude-sonnet-5
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Skill]
  prompt: 'The plan is done. Set up the repo and stand up the walking skeleton so it actually runs before feature work starts.'
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(agentic-sdlc-kit:)?project-scaffolding"'
    min: 1
